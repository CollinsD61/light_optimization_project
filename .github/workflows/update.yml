name: Deploy to VPS

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node cho FE
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FE dependencies
        run: npm install
        working-directory: FE

      - name: Lint FE
        run: npm run lint || true
        working-directory: FE

      - name: Build FE
        run: npm run build
        working-directory: FE

      # 3. SonarCloud Scan 
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 4. Snyk Scan (FE và BE source)
      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Snyk test (FE)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          rm -f package-lock.json
          snyk test
        working-directory: FE

      - name: Snyk test (BE)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test
        working-directory: BE

      # 5. Build Docker image cho FE & BE
      - name: Build FE Docker image
        run: docker build -t fe-app:ci-latest ./FE

      - name: Build BE Docker image
        run: docker build -t be-app:ci-latest ./BE

      # 6. Snyk Container scan image FE
      - name: Snyk container scan FE image
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk container test fe-app:ci-latest || true

      # 7. Snyk Container scan image BE
      - name: Snyk container scan BE image
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk container test be-app:ci-latest || true

      # 8. Trivy scan FE & BE Docker image
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Trivy scan FE image
        run: trivy image --severity CRITICAL,HIGH fe-app:ci-latest

      - name: Trivy scan BE image
        run: trivy image --severity CRITICAL,HIGH be-app:ci-latest

      # 9. Selenium UI test
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Selenium and requirements
        run: |
          pip install selenium
          pip install -r requirements.txt || true
        working-directory: selenium

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run Selenium Python UI tests
        run: python test.py
        working-directory: selenium

      # 10. Install BE dependencies (local, nếu cần)
      - name: Install BE dependencies
        run: pip install -r requirements.txt
        working-directory: BE

      # 11. Setup SSH key
      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      # 12. Prepare project folder on VPS
      - name: Prepare project folder on VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p /root/web_project"

      # 13. Rsync code lên VPS (bỏ qua venv)
      - name: Copy codebase to VPS via rsync (ignore venv)
        run: |
          rsync -avz --delete --exclude 'venv' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/root/web_project/

      # 14. SSH and deploy Docker Compose
      - name: SSH and deploy Docker Compose
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd /root/web_project &&
            docker compose down || true &&
            docker compose up -d --build &&
            docker image prune -af
          "
