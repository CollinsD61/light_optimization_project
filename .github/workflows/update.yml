name: Deploy to VPS

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for deployment'
        required: false
        default: 'Manual deployment'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup SSH key
      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      # Prepare project folder on VPS
      - name: Prepare project folder on VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p /root/web_project"

      # Rsync code lên VPS (bỏ qua venv và deploy markers)
      - name: Copy codebase to VPS via rsync (ignore venv and markers)
        run: |
          rsync -avz --delete \
            --exclude 'venv' \
            --exclude '.deploy-markers' \
            --exclude 'node_modules' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/root/web_project/

      # SSH and deploy Docker Compose (Node.js Backend)
      - name: SSH and deploy Docker Compose
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd /root/web_project &&
            
            # Enable Docker BuildKit for better layer caching
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            
            # Hạ cấp React và ReactDOM xuống phiên bản 18 (Frontend)
            cd FE && 
            sed -i 's/\"react\": \"^19.0.0\"/\"react\": \"^18.2.0\"/g' package.json &&
            sed -i 's/\"react-dom\": \"^19.0.0\"/\"react-dom\": \"^18.2.0\"/g' package.json &&
            
            # Cập nhật các types React tương ứng
            sed -i 's/\"@types\/react\": \"^19.0.10\"/\"@types\/react\": \"^18.2.48\"/g' package.json &&
            sed -i 's/\"@types\/react-dom\": \"^19.0.4\"/\"@types\/react-dom\": \"^18.2.19\"/g' package.json &&
            
            # Cài đặt headlessUI sau khi đã hạ cấp React
            npm install @headlessui/react @heroicons/react --save &&
            cd .. &&
            
            echo '🔍 Detecting changes to determine which containers to rebuild...'
            
            # Detect changes in source code by comparing with last deployment markers
            FE_CHANGED=false
            BE_CHANGED=false
            
            # Create marker directory if not exists
            mkdir -p .deploy-markers
            
            # Check Frontend changes
            if [ -f .deploy-markers/fe-last-deploy ]; then
              FE_NEWER=\$(find FE -type f -newer .deploy-markers/fe-last-deploy 2>/dev/null | wc -l)
              if [ \"\$FE_NEWER\" -gt 0 ]; then
                echo '🔄 Frontend: Changes detected (\$FE_NEWER files modified), will rebuild'
                FE_CHANGED=true
              else
                echo '✅ Frontend: No changes detected, will use cache'
              fi
            else
              echo '🆕 Frontend: First deployment, will build'
              FE_CHANGED=true
            fi
            
            # Check Backend changes
            if [ -f .deploy-markers/be-last-deploy ]; then
              BE_NEWER=\$(find BE_nodejs -type f -newer .deploy-markers/be-last-deploy 2>/dev/null | wc -l)
              if [ \"\$BE_NEWER\" -gt 0 ]; then
                echo '🔄 Backend: Changes detected (\$BE_NEWER files modified), will rebuild'
                BE_CHANGED=true
              else
                echo '✅ Backend: No changes detected, will use cache'
              fi
            else
              echo '🆕 Backend: First deployment, will build'
              BE_CHANGED=true
            fi
            
            # Stop running containers
            echo '⏹️  Stopping containers...'
            docker compose down || true
            
            # Smart rebuild - only rebuild changed services
            if [ \"\$FE_CHANGED\" = true ] && [ \"\$BE_CHANGED\" = true ]; then
              echo '🔨 Building both Frontend and Backend (with cache)...'
              docker compose build frontend backend
              # Update both markers
              touch .deploy-markers/fe-last-deploy
              touch .deploy-markers/be-last-deploy
            elif [ \"\$FE_CHANGED\" = true ]; then
              echo '🔨 Building Frontend only (with cache)...'
              docker compose build frontend
              # Update FE marker only
              touch .deploy-markers/fe-last-deploy
            elif [ \"\$BE_CHANGED\" = true ]; then
              echo '🔨 Building Backend only (with cache)...'
              docker compose build backend
              # Update BE marker only
              touch .deploy-markers/be-last-deploy
            else
              echo '✅ No source changes, using existing images'
            fi
            
            # Start all containers
            echo '🚀 Starting containers...'
            docker compose up -d
            
            # Clean up dangling images only (not all images)
            echo '🧹 Cleaning up dangling images...'
            docker image prune -f
          "

      # Verify Node.js Backend health
      - name: Verify Node.js Backend deployment
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd /root/web_project &&
            sleep 10 &&
            echo '--- Checking backend health ---' &&
            docker compose logs backend --tail=30 &&
            echo '--- Testing backend API ---' &&
            curl -f http://localhost:8000/api/health || echo 'Backend not ready yet'
          "

      # Debug container issues
      - name: Debug container issues
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd /root/web_project &&
            
            # Kiểm tra cấu trúc thư mục
            echo '--- Checking directory structure ---' &&
            ls -la BE_nodejs &&
            ls -la FE &&
            
            # Kiểm tra package.json
            echo '--- Checking FE package.json ---' &&
            cat FE/package.json | grep headless &&
            
            echo '--- Checking BE_nodejs package.json ---' &&
            cat BE_nodejs/package.json | grep express &&
            
            # Kiểm tra log containers
            echo '--- Checking frontend logs ---' &&
            docker compose logs --tail=30 frontend &&
            echo '--- Checking backend logs ---' &&
            docker compose logs --tail=30 backend &&
            echo '--- Checking database logs ---' &&
            docker compose logs --tail=20 db
          "

      # Verification sau khi build
      - name: Verify deployment (Frontend & Node.js Backend)
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd /root/web_project &&
            
            # Kiểm tra phiên bản React trong package.json
            echo '--- React version in package.json after update ---' &&
            cat FE/package.json | grep react &&
            
            # Kiểm tra headlessUI trong package.json
            echo '--- HeadlessUI in package.json ---' &&
            cat FE/package.json | grep headlessui &&
            
            # Kiểm tra Node.js Backend dependencies
            echo '--- Node.js Backend dependencies ---' &&
            cat BE_nodejs/package.json | grep express | head -5 &&
            
            # Kiểm tra containers đang chạy
            echo '--- Running containers ---' &&
            docker compose ps &&
            
            # Test API endpoints
            echo '--- Testing API health endpoint ---' &&
            sleep 5 &&
            curl -f http://localhost:8000/api/health || echo 'Waiting for backend...' &&
            
            # Test Frontend
            echo '--- Testing Frontend ---' &&
            curl -f http://localhost:5173/ || echo 'Waiting for frontend...'
          "