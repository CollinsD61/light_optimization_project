name: Deploy to VPS

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js cho FE
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Install FE dependencies
      - name: Install FE dependencies
        run: |
          # Hạ cấp React trước khi cài đặt dependencies
          sed -i 's/\"react\": \"^19.0.0\"/\"react\": \"^18.2.0\"/g' package.json
          sed -i 's/\"react-dom\": \"^19.0.0\"/\"react-dom\": \"^18.2.0\"/g' package.json
          sed -i 's/\"@types\/react\": \"^19.0.10\"/\"@types\/react\": \"^18.2.48\"/g' package.json
          sed -i 's/\"@types\/react-dom\": \"^19.0.4\"/\"@types\/react-dom\": \"^18.2.19\"/g' package.json
          # Cài đặt dependencies
          npm install
        working-directory: FE

      - name: Lint FE
        run: npm run lint || true
        working-directory: FE

      - name: Build FE
        run: npm run build
        working-directory: FE

      # 4. SonarCloud Scan 
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 5. Snyk quét source (FE)
      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Snyk test (FE)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          rm -f package-lock.json
          snyk test || true
        working-directory: FE

      # 6. Cài BE dependencies trước khi quét Snyk BE!
      - name: Install BE dependencies
        run: pip install -r requirements.txt
        working-directory: BE

      # 7. Snyk test (BE)
      - name: Snyk test (BE)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test || true
        working-directory: BE

      # 8. Build Docker image FE & BE
      - name: Build FE Docker image
        run: docker build -t fe-app:ci-latest ./FE

      - name: Build BE Docker image
        run: docker build -t be-app:ci-latest ./BE

      # 9. Snyk quét image FE & BE
      - name: Snyk container scan FE image
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk container test fe-app:ci-latest || true

      - name: Snyk container scan BE image
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk container test be-app:ci-latest || true

      # 10. Trivy quét image FE & BE
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Trivy scan FE image
        run: trivy image --severity CRITICAL,HIGH fe-app:ci-latest

      - name: Trivy scan BE image
        run: trivy image --severity CRITICAL,HIGH be-app:ci-latest

      # 11. Selenium UI test (build & start FE server)
      - name: Start FE server (Vite dev)
        run: nohup npm run dev -- --host 0.0.0.0 &
        working-directory: FE

      - name: Wait FE server ready
        run: |
          for i in {1..10}; do
            curl -sSf http://localhost:5173/ && exit 0
            echo "Waiting for FE server..."
            sleep 2
          done
          echo "FE server did not start in time!" && exit 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Selenium (no requirements.txt)
        run: pip install selenium
        working-directory: selenium

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run Selenium Python UI tests
        run: python test.py
        working-directory: selenium

      # 12. Setup SSH key
      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      # 13. Prepare project folder on VPS
      - name: Prepare project folder on VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p /root/web_project"

      # 14. Rsync code lên VPS (bỏ qua venv)
      - name: Copy codebase to VPS via rsync (ignore venv)
        run: |
          rsync -avz --delete --exclude 'venv' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/root/web_project/

      # 15. SSH and deploy Docker Compose
      - name: SSH and deploy Docker Compose
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd /root/web_project &&
            
            # Hạ cấp React và ReactDOM xuống phiên bản 18
            cd FE && 
            sed -i 's/\"react\": \"^19.0.0\"/\"react\": \"^18.2.0\"/g' package.json &&
            sed -i 's/\"react-dom\": \"^19.0.0\"/\"react-dom\": \"^18.2.0\"/g' package.json &&
            
            # Cập nhật các types React tương ứng
            sed -i 's/\"@types\/react\": \"^19.0.10\"/\"@types\/react\": \"^18.2.48\"/g' package.json &&
            sed -i 's/\"@types\/react-dom\": \"^19.0.4\"/\"@types\/react-dom\": \"^18.2.19\"/g' package.json &&
            
            # Cài đặt headlessUI sau khi đã hạ cấp React
            npm install @headlessui/react @heroicons/react --save &&
            cd .. &&
            
            # Xóa các container cũ và build lại
            docker compose down || true &&
            docker compose build --no-cache frontend &&
            docker compose up -d &&
            docker image prune -af
          "

      # 16. SSH vào VPS và migrate DB cho Django backend
      - name: SSH và migrate Django DB trên VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd /root/web_project &&
            sleep 10 &&
            docker compose run --rm backend python manage.py makemigrations &&
            docker compose run --rm backend python manage.py migrate
          "

      #  kiểm tra lỗi
      - name: Debug container issues
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd /root/web_project &&
            
            # Kiểm tra cấu trúc thư mục
            echo '--- Checking directory structure ---' &&
            ls -la FE &&
            
            # Kiểm tra package.json
            echo '--- Checking package.json ---' &&
            cat FE/package.json | grep headless &&
            
            # Kiểm tra log container
            echo '--- Checking container logs ---' &&
            docker compose logs --tail=50 frontend
          "

      #  bước verification sau khi build
      - name: Verify React version and headlessUI installation
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd /root/web_project &&
            
            # Kiểm tra phiên bản React trong package.json
            echo '--- React version in package.json after update ---' &&
            cat FE/package.json | grep react &&
            
            # Kiểm tra headlessUI trong package.json
            echo '--- HeadlessUI in package.json ---' &&
            cat FE/package.json | grep headlessui &&
            
            # Kiểm tra phiên bản trong container
            echo '--- React version in container ---' &&
            docker compose exec frontend cat /app/package.json | grep react
          "