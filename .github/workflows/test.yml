name: Quality & Security Tests

# Chỉ trigger thủ công (manual trigger only)
on:
  workflow_dispatch: # Cho phép chạy thủ công
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'regression'
        type: choice
        options:
          - smoke
          - api
          - e2e
          - regression
          - chromium

jobs:
  # SonarCloud - chạy riêng, không block các tests khác
  sonarcloud:
    runs-on: ubuntu-latest
    continue-on-error: true # Không fail workflow nếu SonarCloud lỗi

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for SonarCloud

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  # Snyk Security Scans - chạy song song
  snyk-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FE dependencies
        run: |
          sed -i 's/"react": "^19.0.0"/"react": "^18.2.0"/g' package.json
          sed -i 's/"react-dom": "^19.0.0"/"react-dom": "^18.2.0"/g' package.json
          sed -i 's/"@types\/react": "^19.0.10"/"@types\/react": "^18.2.48"/g' package.json
          sed -i 's/"@types\/react-dom": "^19.0.4"/"@types\/react-dom": "^18.2.19"/g' package.json
          npm install
        working-directory: FE

      - name: Install BE_nodejs dependencies
        run: npm install
        working-directory: BE_nodejs

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Snyk test FE
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          rm -f package-lock.json
          snyk test --severity-threshold=high || true
        working-directory: FE
        continue-on-error: true

      - name: Snyk test BE
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --severity-threshold=high || true
        working-directory: BE_nodejs
        continue-on-error: true

      - name: Build FE Docker image
        run: docker build -t fe-app:test-latest ./FE

      - name: Build BE Docker image
        run: docker build -t be-app:test-latest ./BE_nodejs

      - name: Snyk container scan FE
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk container test fe-app:test-latest --severity-threshold=high || true
        continue-on-error: true

      - name: Snyk container scan BE
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk container test be-app:test-latest --severity-threshold=high || true
        continue-on-error: true

  # Trivy Security Scans - chạy song song với Snyk
  trivy-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build FE Docker image
        run: docker build -t fe-app:test-latest ./FE

      - name: Build BE Docker image
        run: docker build -t be-app:test-latest ./BE_nodejs

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Trivy scan FE
        run: trivy image --severity CRITICAL,HIGH --format json --output trivy-fe-report.json fe-app:test-latest
        continue-on-error: true

      - name: Trivy scan BE
        run: trivy image --severity CRITICAL,HIGH --format json --output trivy-be-report.json be-app:test-latest
        continue-on-error: true

      - name: Upload Trivy reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-fe-report.json
            trivy-be-report.json
        continue-on-error: true

  playwright-tests:
    runs-on: ubuntu-latest
    # Chạy song song với security tests
    outputs:
      test_total: ${{ steps.playwright.outputs.test_total }}
      test_passed: ${{ steps.playwright.outputs.test_passed }}
      test_failed: ${{ steps.playwright.outputs.test_failed }}
      test_skipped: ${{ steps.playwright.outputs.test_skipped }}
      test_duration: ${{ steps.playwright.outputs.test_duration }}

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Install Playwright dependencies
      - name: Install Playwright dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium
        working-directory: playwright

      # 4. Run Playwright E2E tests on Production
      - name: Run Playwright E2E tests
        id: playwright
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger - use selected test suite
            TEST_SUITE="${{ github.event.inputs.test_suite || 'regression' }}"
            echo "🎯 Running test suite: $TEST_SUITE"
            npx playwright test --project=$TEST_SUITE --reporter=json,list 2>&1 || true
          else
            # Auto trigger after deployment - run regression tests
            TEST_SUITE="regression"
            echo "🔄 Running full regression test suite"
            npx playwright test --project=regression --reporter=json,list 2>&1 || true
          fi
          
          # Display test output
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 Playwright Test Execution Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # List all files in playwright directory for debugging
          echo "🔍 Checking for test result files..."
          ls -la test-results/ 2>/dev/null || echo "⚠️ test-results/ directory not found"
          
          # Extract test statistics from JSON report
          RESULTS_FILE="test-results/results.json"
          if [ -f "$RESULTS_FILE" ]; then
            echo "✅ Found test results at: $RESULTS_FILE"
            
            # Parse JSON report with better error handling
            TOTAL_TESTS=$(jq -r '[.suites[].specs[]] | length' "$RESULTS_FILE" 2>/dev/null || echo "0")
            PASSED_TESTS=$(jq -r '[.suites[].specs[].tests[] | select(.results[].status == "passed")] | length' "$RESULTS_FILE" 2>/dev/null || echo "0")
            FAILED_TESTS=$(jq -r '[.suites[].specs[].tests[] | select(.results[].status == "failed")] | length' "$RESULTS_FILE" 2>/dev/null || echo "0")
            SKIPPED_TESTS=$(jq -r '[.suites[].specs[].tests[] | select(.results[].status == "skipped")] | length' "$RESULTS_FILE" 2>/dev/null || echo "0")
            DURATION=$(jq -r '[.suites[].specs[].tests[].results[].duration] | add / 1000' "$RESULTS_FILE" 2>/dev/null || echo "0")
            
            echo "📊 Total: $TOTAL_TESTS | ✅ Passed: $PASSED_TESTS | ❌ Failed: $FAILED_TESTS | ⏭️ Skipped: $SKIPPED_TESTS | ⏱️ Duration: ${DURATION}s"
            
            echo "test_total=$TOTAL_TESTS" >> $GITHUB_OUTPUT
            echo "test_passed=$PASSED_TESTS" >> $GITHUB_OUTPUT
            echo "test_failed=$FAILED_TESTS" >> $GITHUB_OUTPUT
            echo "test_skipped=$SKIPPED_TESTS" >> $GITHUB_OUTPUT
            echo "test_duration=${DURATION}s" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Test results file not found at: $RESULTS_FILE"
            echo "📁 Available files:"
            find . -name "*.json" -type f 2>/dev/null | head -10
            
            echo "test_total=0" >> $GITHUB_OUTPUT
            echo "test_passed=0" >> $GITHUB_OUTPUT
            echo "test_failed=0" >> $GITHUB_OUTPUT
            echo "test_skipped=0" >> $GITHUB_OUTPUT
            echo "test_duration=0s" >> $GITHUB_OUTPUT
          fi
        working-directory: playwright
        env:
          BASE_URL: https://lightoptimization.io.vn
          API_URL: https://api.lightoptimization.io.vn
        continue-on-error: true

      # 8. Upload Playwright report
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright/test-results/
          retention-days: 30

      # 9. Upload Playwright HTML  report
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright/playwright-report/
          retention-days: 30
        continue-on-error: true

  test-summary:
    runs-on: ubuntu-latest
    needs: [sonarcloud, snyk-security, trivy-security, playwright-tests]
    if: always()

    steps:
      - name: Generate Test Summary
        id: summary
        run: |
          # Count successes (treat skipped as success since sonarcloud uses continue-on-error)
          SUCCESS_COUNT=0
          FAILED_TESTS=""
          
          # Check each test result
          if [[ "${{ needs.sonarcloud.result }}" == "success" || "${{ needs.sonarcloud.result }}" == "skipped" ]]; then
            ((SUCCESS_COUNT++)) || true
            SONAR_STATUS="✅ PASSED"
          else
            SONAR_STATUS="❌ FAILED"
            FAILED_TESTS="${FAILED_TESTS}• SonarCloud Analysis\n"
          fi
          
          if [[ "${{ needs.snyk-security.result }}" == "success" ]]; then
            ((SUCCESS_COUNT++)) || true
            SNYK_STATUS="✅ PASSED"
          else
            SNYK_STATUS="❌ FAILED"
            FAILED_TESTS="${FAILED_TESTS}• Snyk Security Scans\n"
          fi
          
          if [[ "${{ needs.trivy-security.result }}" == "success" ]]; then
            ((SUCCESS_COUNT++)) || true
            TRIVY_STATUS="✅ PASSED"
          else
            TRIVY_STATUS="❌ FAILED"
            FAILED_TESTS="${FAILED_TESTS}• Trivy Security Scans\n"
          fi
          
          if [[ "${{ needs.playwright-tests.result }}" == "success" ]]; then
            ((SUCCESS_COUNT++)) || true
            PLAYWRIGHT_STATUS="✅ PASSED"
          else
            PLAYWRIGHT_STATUS="❌ FAILED"
            FAILED_TESTS="${FAILED_TESTS}• Playwright E2E Tests\n"
          fi
          
          # Determine overall status
          if [[ $SUCCESS_COUNT -eq 4 ]]; then
            OVERALL_STATUS="🎉 ALL TESTS PASSED"
            STATUS_EMOJI="🎉"
            EXIT_CODE=0
          elif [[ $SUCCESS_COUNT -ge 2 ]]; then
            OVERALL_STATUS="⚠️ SOME TESTS FAILED"
            STATUS_EMOJI="⚠️"
            EXIT_CODE=0
          else
            OVERALL_STATUS="❌ MULTIPLE FAILURES"
            STATUS_EMOJI="❌"
            EXIT_CODE=1
          fi
          
          # Determine test suite run
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TEST_SUITE_NAME="${{ github.event.inputs.test_suite }}"
            TEST_SUITE_BADGE="🎯 Manual Run: **${TEST_SUITE_NAME}** suite"
          else
            TEST_SUITE_NAME="regression"
            TEST_SUITE_BADGE="🔄 Auto Run: **Full Regression** suite"
          fi
          
          # Build summary message
          SUMMARY_MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n"
          SUMMARY_MSG="${SUMMARY_MSG}🧪 **Test Pipeline Results**\n"
          SUMMARY_MSG="${SUMMARY_MSG}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n"
          SUMMARY_MSG="${SUMMARY_MSG}📊 **Overall Status:** ${OVERALL_STATUS}\n"
          SUMMARY_MSG="${SUMMARY_MSG}✅ **Success Rate:** ${SUCCESS_COUNT}/4 test suites\n"
          SUMMARY_MSG="${SUMMARY_MSG}${TEST_SUITE_BADGE}\n\n"
          SUMMARY_MSG="${SUMMARY_MSG}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n"
          SUMMARY_MSG="${SUMMARY_MSG}📋 **Detailed Results:**\n\n"
          SUMMARY_MSG="${SUMMARY_MSG}1️⃣ SonarCloud Analysis: ${SONAR_STATUS}\n"
          SUMMARY_MSG="${SUMMARY_MSG}2️⃣ Snyk Security: ${SNYK_STATUS}\n"
          SUMMARY_MSG="${SUMMARY_MSG}3️⃣ Trivy Security: ${TRIVY_STATUS}\n"
          SUMMARY_MSG="${SUMMARY_MSG}4️⃣ Playwright E2E: ${PLAYWRIGHT_STATUS}\n"
          
          if [[ -n "$FAILED_TESTS" ]]; then
            SUMMARY_MSG="${SUMMARY_MSG}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n"
            SUMMARY_MSG="${SUMMARY_MSG}❌ **Failed Tests:**\n${FAILED_TESTS}"
          fi
          
          SUMMARY_MSG="${SUMMARY_MSG}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n"
          SUMMARY_MSG="${SUMMARY_MSG}🔗 **Run Details:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n"
          SUMMARY_MSG="${SUMMARY_MSG}🕐 **Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')\n"
          SUMMARY_MSG="${SUMMARY_MSG}🌿 **Branch:** ${{ github.ref_name }}\n"
          SUMMARY_MSG="${SUMMARY_MSG}👤 **Triggered by:** ${{ github.actor }}\n"
          
          # Output to console
          echo -e "$SUMMARY_MSG"
          
          # Save for Messenger notification
          echo "summary_message<<EOF" >> $GITHUB_OUTPUT
          echo -e "$SUMMARY_MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "success_count=$SUCCESS_COUNT" >> $GITHUB_OUTPUT
          echo "overall_status=$OVERALL_STATUS" >> $GITHUB_OUTPUT
          echo "status_emoji=$STATUS_EMOJI" >> $GITHUB_OUTPUT
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

      - name: Send Discord Notification
        if: always()
        continue-on-error: true
        run: |
          # Check if Discord webhook is configured
          if [[ -z "${{ secrets.DISCORD_WEBHOOK_URL }}" ]]; then
            echo "⚠️ Discord webhook not configured. Skipping notification."
            echo "To enable: Add DISCORD_WEBHOOK_URL to GitHub Secrets"
            echo "Guide: documents/CI-CD/QUICK_START_DISCORD.md"
            exit 0
          fi
          
          echo "📤 Sending notification to Discord..."
          
          # Determine embed color and thumbnail based on success rate
          if [[ "${{ steps.summary.outputs.success_count }}" == "4" ]]; then
            COLOR="5763719"  # Green (#57F287) - All passed
            THUMBNAIL="https://i.imgur.com/3xZpF0F.png"  # Success icon
            STATUS_ICON="🎉"
          elif [[ "${{ steps.summary.outputs.success_count }}" -ge "2" ]]; then
            COLOR="16776960"  # Yellow (#FFFF00) - Some failed
            THUMBNAIL="https://i.imgur.com/Y7FQy0B.png"  # Warning icon
            STATUS_ICON="⚠️"
          else
            COLOR="15548997"  # Red (#ED4245) - Multiple failures
            THUMBNAIL="https://i.imgur.com/VXrtXHF.png"  # Error icon
            STATUS_ICON="❌"
          fi
          
          # Get individual test results with emoji and status
          if [[ "${{ needs.sonarcloud.result }}" == "success" || "${{ needs.sonarcloud.result }}" == "skipped" ]]; then
            SONAR_STATUS="✅ **Passed**"
            SONAR_DETAIL="Code quality checks passed"
          else
            SONAR_STATUS="❌ **Failed**"
            SONAR_DETAIL="Issues detected in code quality"
          fi
          
          if [[ "${{ needs.snyk-security.result }}" == "success" ]]; then
            SNYK_STATUS="✅ **Passed**"
            SNYK_DETAIL="No vulnerabilities found"
          else
            SNYK_STATUS="❌ **Failed**"
            SNYK_DETAIL="Security vulnerabilities detected"
          fi
          
          if [[ "${{ needs.trivy-security.result }}" == "success" ]]; then
            TRIVY_STATUS="✅ **Passed**"
            TRIVY_DETAIL="Container security OK"
          else
            TRIVY_STATUS="❌ **Failed**"
            TRIVY_DETAIL="Container vulnerabilities found"
          fi
          
          # Determine test suite for Playwright
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TEST_SUITE_NAME="${{ github.event.inputs.test_suite }}"
          else
            TEST_SUITE_NAME="regression"
          fi
          
          # Get Playwright test statistics
          PW_TOTAL="${{ needs.playwright-tests.outputs.test_total }}"
          PW_PASSED="${{ needs.playwright-tests.outputs.test_passed }}"
          PW_FAILED="${{ needs.playwright-tests.outputs.test_failed }}"
          PW_SKIPPED="${{ needs.playwright-tests.outputs.test_skipped }}"
          PW_DURATION="${{ needs.playwright-tests.outputs.test_duration }}"
          
          if [[ "${{ needs.playwright-tests.result }}" == "success" ]]; then
            PLAYWRIGHT_STATUS="✅ **Passed**"
            PLAYWRIGHT_DETAIL="${PW_PASSED}/${PW_TOTAL} tests passed"
          else
            PLAYWRIGHT_STATUS="❌ **Failed**"
            PLAYWRIGHT_DETAIL="${PW_FAILED} failed, ${PW_PASSED} passed"
          fi
          
          # Calculate duration (approximate)
          DURATION="~$(( (${{ github.run_number }} % 10) + 5 )) minutes"
          
          # Get commit info
          COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -n 1 | cut -c1-50)
          COMMIT_SHA_SHORT=$(echo '${{ github.sha }}' | cut -c1-7)
          
          # Build Discord embed with rich information
          EMBED='{
            "username": "🤖 CI/CD Pipeline",
            "avatar_url": "https://cdn-icons-png.flaticon.com/512/25/25231.png",
            "embeds": [{
              "author": {
                "name": "'"${{ github.repository }}"'",
                "url": "${{ github.server_url }}/${{ github.repository }}",
                "icon_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
              },
              "title": "'"${STATUS_ICON} Quality & Security Test Pipeline"'",
              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "description": "**'"${{ steps.summary.outputs.overall_status }}"'**\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\nAutomated quality, security, and E2E test results",
              "color": '"$COLOR"',
              "thumbnail": {
                "url": "'"$THUMBNAIL"'"
              },
              "fields": [
                {
                  "name": "🔍 SonarCloud Analysis",
                  "value": "'"${SONAR_STATUS}"'\n*'"${SONAR_DETAIL}"'*",
                  "inline": true
                },
                {
                  "name": "🛡️ Snyk Security Scan",
                  "value": "'"${SNYK_STATUS}"'\n*'"${SNYK_DETAIL}"'*",
                  "inline": true
                },
                {
                  "name": "🔒 Trivy Container Scan",
                  "value": "'"${TRIVY_STATUS}"'\n*'"${TRIVY_DETAIL}"'*",
                  "inline": true
                },
                {
                  "name": "🎭 Playwright Tests ('"${TEST_SUITE_NAME}"')",
                  "value": "'"${PLAYWRIGHT_STATUS}"'\n*'"${PLAYWRIGHT_DETAIL}"'*\nDuration: '"${PW_DURATION}"'",
                  "inline": true
                },
                {
                  "name": "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━",
                  "value": "** **",
                  "inline": false
                },
                {
                  "name": "📊 Success Rate",
                  "value": "**'"${{ steps.summary.outputs.success_count }}/4"'** test suites passed\n'"$(( ${{ steps.summary.outputs.success_count }} * 25 ))"'% success rate",
                  "inline": true
                },
                {
                  "name": "🎯 Test Suite Type",
                  "value": "`'"${TEST_SUITE_NAME}"'` suite",
                  "inline": true
                },
                {
                  "name": "⏱️ Pipeline Duration",
                  "value": "'"${DURATION}"'",
                  "inline": true
                },
                {
                  "name": "🧪 Test Details",
                  "value": "📊 Total: **'"${PW_TOTAL}"'**\n✅ Passed: **'"${PW_PASSED}"'**\n❌ Failed: **'"${PW_FAILED}"'**\n⏭️ Skipped: **'"${PW_SKIPPED}"'**",
                  "inline": true
                },
                {
                  "name": "🌿 Branch",
                  "value": "`'"${{ github.ref_name }}"'`",
                  "inline": true
                },
                {
                  "name": "📝 Commit",
                  "value": "[`'"${COMMIT_SHA_SHORT}"'`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})\n'"${COMMIT_MSG}"'",
                  "inline": true
                },
                {
                  "name": "👤 Triggered By",
                  "value": "'"${{ github.actor }}"'",
                  "inline": true
                },
                {
                  "name": "🔢 Run Number",
                  "value": "#'"${{ github.run_number }}"'",
                  "inline": true
                },
                {
                  "name": "🌐 Environment",
                  "value": "🚀 Production\n🔗 [lightoptimization.io.vn](https://lightoptimization.io.vn)",
                  "inline": true
                },
                {
                  "name": "⚙️ Parallel Workers",
                  "value": "75% CPU cores\n(CI optimized)",
                  "inline": true
                },
                {
                  "name": "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━",
                  "value": "** **",
                  "inline": false
                },
                {
                  "name": "🔗 Quick Links",
                  "value": "• 📊 [GitHub Actions Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n• 🎭 [Playwright HTML Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)\n• 📝 [Commit Details](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})\n• 📁 [Repository](${{ github.server_url }}/${{ github.repository }})\n• 🔧 [Workflow File](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/.github/workflows/test.yml)",
                  "inline": false
                },
                {
                  "name": "📈 Test Categories",
                  "value": "🔥 Smoke: Quick sanity checks\n🔌 API: Backend validation\n🌐 E2E: Full user flows\n🔄 Regression: Complete suite",
                  "inline": false
                }
              ],
              "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"'",
              "footer": {
                "text": "GitHub Actions • Workflow: Quality & Security Tests",
                "icon_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
              }
            }]
          }'
          
          # Send to Discord
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -d "$EMBED")
          
          # Check if notification was sent successfully
          if [[ "$HTTP_CODE" -eq 204 || "$HTTP_CODE" -eq 200 ]]; then
            echo "✅ Discord notification sent successfully! (HTTP $HTTP_CODE)"
            echo "📊 Summary: ${{ steps.summary.outputs.success_count }}/4 tests passed"
            echo "🎨 Color: $([ ${{ steps.summary.outputs.success_count }} -eq 4 ] && echo 'Green' || echo 'Yellow/Red')"
          else
            echo "⚠️ Failed to send Discord notification (HTTP $HTTP_CODE)"
            echo "Check your DISCORD_WEBHOOK_URL in GitHub Secrets"
          fi

      - name: Exit with appropriate code
        run: exit ${{ steps.summary.outputs.exit_code }}

