name: Quality & Security Tests

# Trigger khi update.yml hoàn thành hoặc chạy thủ công
on:
  workflow_run:
    workflows: ["Deploy to VPS"]
    types:
      - completed
  workflow_dispatch: # Cho phép chạy thủ công

jobs:
  # SonarCloud - chạy riêng, không block các tests khác
  sonarcloud:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    continue-on-error: true # Không fail workflow nếu SonarCloud lỗi

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for SonarCloud

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  # Snyk Security Scans - chạy song song
  snyk-security:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FE dependencies
        run: |
          sed -i 's/"react": "^19.0.0"/"react": "^18.2.0"/g' package.json
          sed -i 's/"react-dom": "^19.0.0"/"react-dom": "^18.2.0"/g' package.json
          sed -i 's/"@types\/react": "^19.0.10"/"@types\/react": "^18.2.48"/g' package.json
          sed -i 's/"@types\/react-dom": "^19.0.4"/"@types\/react-dom": "^18.2.19"/g' package.json
          npm install
        working-directory: FE

      - name: Install BE_nodejs dependencies
        run: npm install
        working-directory: BE_nodejs

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Snyk test FE
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          rm -f package-lock.json
          snyk test --severity-threshold=high || true
        working-directory: FE
        continue-on-error: true

      - name: Snyk test BE
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --severity-threshold=high || true
        working-directory: BE_nodejs
        continue-on-error: true

      - name: Build FE Docker image
        run: docker build -t fe-app:test-latest ./FE

      - name: Build BE Docker image
        run: docker build -t be-app:test-latest ./BE_nodejs

      - name: Snyk container scan FE
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk container test fe-app:test-latest --severity-threshold=high || true
        continue-on-error: true

      - name: Snyk container scan BE
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk container test be-app:test-latest --severity-threshold=high || true
        continue-on-error: true

  # Trivy Security Scans - chạy song song với Snyk
  trivy-security:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build FE Docker image
        run: docker build -t fe-app:test-latest ./FE

      - name: Build BE Docker image
        run: docker build -t be-app:test-latest ./BE_nodejs

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Trivy scan FE
        run: trivy image --severity CRITICAL,HIGH --format json --output trivy-fe-report.json fe-app:test-latest
        continue-on-error: true

      - name: Trivy scan BE
        run: trivy image --severity CRITICAL,HIGH --format json --output trivy-be-report.json be-app:test-latest
        continue-on-error: true

      - name: Upload Trivy reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-fe-report.json
            trivy-be-report.json
        continue-on-error: true

  playwright-tests:
    runs-on: ubuntu-latest
    # Chạy song song với security tests
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Install Playwright dependencies
      - name: Install Playwright dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium
        working-directory: playwright

      # 4. Run Playwright E2E tests on Production
      - name: Run Playwright E2E tests
        run: npx playwright test --project=chromium
        working-directory: playwright
        env:
          BASE_URL: https://lightoptimization.io.vn
          API_URL: https://lightoptimization.io.vn/api
        continue-on-error: true

      # 8. Upload Playwright report
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright/test-results/
          retention-days: 30

      # 9. Upload Playwright HTML  report
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright/playwright-report/
          retention-days: 30
        continue-on-error: true

  test-summary:
    runs-on: ubuntu-latest
    needs: [sonarcloud, snyk-security, trivy-security, playwright-tests]
    if: always()

    steps:
      - name: Test Summary
        run: |
          echo "## 🧪 Test Results Summary"
          echo ""
          echo "### SonarCloud Analysis"
          echo "Status: ${{ needs.sonarcloud.result }}"
          echo ""
          echo "### Snyk Security Scans"
          echo "Status: ${{ needs.snyk-security.result }}"
          echo ""
          echo "### Trivy Security Scans"
          echo "Status: ${{ needs.trivy-security.result }}"
          echo ""
          echo "### Playwright E2E Tests"
          echo "Status: ${{ needs.playwright-tests.result }}"
          echo ""
          
          # Count successes
          SUCCESS_COUNT=0
          [[ "${{ needs.sonarcloud.result }}" == "success" ]] && ((SUCCESS_COUNT++))
          [[ "${{ needs.snyk-security.result }}" == "success" ]] && ((SUCCESS_COUNT++))
          [[ "${{ needs.trivy-security.result }}" == "success" ]] && ((SUCCESS_COUNT++))
          [[ "${{ needs.playwright-tests.result }}" == "success" ]] && ((SUCCESS_COUNT++))
          
          echo "✅ $SUCCESS_COUNT/4 test suites passed"
          
          if [[ $SUCCESS_COUNT -eq 4 ]]; then
            echo "🎉 All tests passed!"
          elif [[ $SUCCESS_COUNT -ge 2 ]]; then
            echo "⚠️ Some tests failed - review logs above"
          else
            echo "❌ Multiple test failures - immediate attention needed"
          fi
          
          exit 0

