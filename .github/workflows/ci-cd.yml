name: CI/CD Pipeline - Node.js Backend

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  # Job 1: Lint & Test Backend
  backend-test:
    name: Test Node.js Backend
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: sensors_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: BE_nodejs/package.json
      
      - name: Install dependencies
        working-directory: BE_nodejs
        run: npm ci
      
      - name: Run linter (if exists)
        working-directory: BE_nodejs
        run: npm run lint || echo "No linter configured"
        continue-on-error: true
      
      - name: Check for syntax errors
        working-directory: BE_nodejs
        run: node -c src/server.js
      
      - name: Test database connection
        working-directory: BE_nodejs
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: sensors_test
          DATABASE_USER: postgres
          DATABASE_PASSWORD: test_password
          JWT_SECRET: test_secret_key_for_ci
          NODE_ENV: test
        run: |
          node -e "
          require('dotenv').config();
          const { sequelize } = require('./src/models');
          sequelize.authenticate()
            .then(() => { console.log('✅ Database connection OK'); process.exit(0); })
            .catch(err => { console.error('❌ Database error:', err); process.exit(1); });
          "

  # Job 2: Build & Test Frontend
  frontend-test:
    name: Test React Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: FE/package-lock.json
      
      - name: Install dependencies
        working-directory: FE
        run: npm ci
      
      - name: Run linter
        working-directory: FE
        run: npm run lint || echo "No linter configured"
        continue-on-error: true
      
      - name: Build frontend
        working-directory: FE
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.lightoptimization.io.vn
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: FE/dist
          retention-days: 7

  # Job 3: SonarCloud Analysis
  sonarcloud:
    name: SonarCloud Code Quality
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis
      
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Job 4: Build Docker Images
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub (Optional)
        if: ${{ secrets.DOCKER_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./BE_nodejs
          file: ./BE_nodejs/Dockerfile
          push: false
          tags: |
            nodejs-backend:latest
            nodejs-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./FE
          file: ./FE/Dockerfile
          push: false
          tags: |
            react-frontend:latest
            react-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test docker-compose
        run: |
          docker-compose config
          echo "✅ docker-compose.yml is valid"

  # Job 5: Security Scan
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'BE_nodejs'
          format: 'sarif'
          output: 'trivy-backend-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true
      
      - name: Run Trivy vulnerability scanner (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'FE'
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-backend-results.sarif'
        continue-on-error: true

  # Job 6: Deploy (Optional - configure as needed)
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build, sonarcloud, security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: production
      url: https://lightoptimization.io.vn
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy notification
        run: |
          echo "🚀 Ready to deploy to production"
          echo "📦 Backend: Node.js + Express + PostgreSQL"
          echo "🎨 Frontend: React + Vite"
          echo "🐳 Docker Compose ready"
      
      # Add your deployment steps here
      # Examples:
      # - SSH to server and pull latest code
      # - Deploy to cloud (AWS, GCP, Azure)
      # - Update Kubernetes deployment
      # - Trigger Ansible playbook
      
      - name: Deployment placeholder
        run: |
          echo "⚠️ Configure your deployment method:"
          echo "  - SSH deployment"
          echo "  - Docker Registry push"
          echo "  - Cloud provider deployment"
          echo "  - Kubernetes update"

  # Job 7: Notification
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, sonarcloud, docker-build]
    if: always()
    
    steps:
      - name: Check job status
        run: |
          echo "Backend Test: ${{ needs.backend-test.result }}"
          echo "Frontend Test: ${{ needs.frontend-test.result }}"
          echo "SonarCloud: ${{ needs.sonarcloud.result }}"
          echo "Docker Build: ${{ needs.docker-build.result }}"
      
      - name: Success notification
        if: ${{ needs.backend-test.result == 'success' && needs.frontend-test.result == 'success' }}
        run: |
          echo "✅ All tests passed!"
          echo "🎉 Pipeline completed successfully"
      
      - name: Failure notification
        if: ${{ needs.backend-test.result == 'failure' || needs.frontend-test.result == 'failure' }}
        run: |
          echo "❌ Some tests failed"
          echo "🔍 Check the logs above for details"
          exit 1

