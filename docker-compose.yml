services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: sensors
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dohoang
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js Backend (Migrated from Django)
  backend:
    build:
      context: ./BE_nodejs
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=sensors
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=dohoang
      - JWT_SECRET=your_super_secret_jwt_key_change_this_in_production
      - JWT_EXPIRES_IN=30m
      - JWT_REFRESH_EXPIRES_IN=1d
      - GOOGLE_CLIENT_ID=1035731953101-ubmukhc15mg1o4uu0vaq6aib5jnjqbte.apps.googleusercontent.com
      - FRONTEND_URL=https://lightoptimization.io.vn
      - CORS_ORIGINS=https://lightoptimization.io.vn,http://localhost:5173,http://127.0.0.1:5173
    networks:
      - backend
    restart: unless-stopped

  # Django Backend (Legacy - uncomment to use Django instead)
  # backend_django:
  #   build:
  #     context: ./BE
  #   depends_on:
  #     - db
  #   ports:
  #     - "8001:8000"
  #   networks:
  #     - backend

  # Django migrations (only needed if using Django backend)
  # migrate:
  #   build:
  #     context: ./BE
  #   depends_on:
  #     - db
  #   command: python manage.py migrate --noinput
  #   env_file:
  #     - ./BE/.env
  #   networks:
  #     - backend

  frontend:
    build:
      context: ./FE
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0
    networks:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:


networks:
  backend:
    driver: bridge
